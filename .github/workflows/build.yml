name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o FastLauncher.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          cd "$(dirname "$F")"
          echo "Building in $(pwd)"
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastLauncher-APK
          path: "**/build/outputs/apk/release/*.apk"
